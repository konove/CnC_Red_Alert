# Two kinds of job:
#   build  - compiles and tests on each supported compiler with the static
#            analysis off. Its question is "does the code build and run on
#            gcc, clang and MSVC".
#   lint   - one Linux job with STRICT_CHECKS on: clang-tidy, IWYU and the
#            extra warnings. The analysis does not depend on the surrounding
#            compiler, so it runs once, on a pinned clang-tidy version.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "build-install-dir=${{ github.workspace }}/build/install" >> "$GITHUB_OUTPUT"
        echo "artifact-name=${{ github.event.repository.name }}-${{ github.sha }}-${{ runner.os }}-${{ matrix.c_compiler }}" >> "$GITHUB_OUTPUT"

    - uses: libsdl-org/setup-sdl@main
      id: sdl
      if: runner.os != 'Linux'
      with:
        install-linux-dependencies: true
        version: 2-latest

    # workaround setup-sdl failing to download (https://github.com/libsdl-org/setup-sdl/issues/23)
    - name: Install SDL and build tools
      if: runner.os == 'Linux'
      run: sudo apt update && sudo apt install libsdl2-dev ninja-build

    - name: Install build tools
      if: runner.os == 'macOS'
      run: brew install ninja

    # Puts cl.exe on PATH so the Ninja generator can find it. Ninja itself is
    # preinstalled on the Windows runner image.
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    # Test discovery runs each test binary at build time, and on Windows it
    # needs SDL2.dll on PATH to start at all.
    - name: Put SDL on PATH
      if: runner.os == 'Windows'
      shell: bash
      run: echo "${{ steps.sdl.outputs.prefix }}/bin" >> "$GITHUB_PATH"

    # Ninja everywhere, including Windows: it stops at the first failed step,
    # where MSBuild keeps building every independent project and only reports
    # the failure at the end.
    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DSTRICT_CHECKS=OFF
        -DCMAKE_INSTALL_PREFIX=${{ steps.strings.outputs.build-install-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --output-on-failure

    - name: Prepare Artifact
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --parallel --target install

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.strings.outputs.artifact-name }}
        path: ${{ steps.strings.outputs.build-install-dir }}

  lint:
    runs-on: ubuntu-latest
    # Blocking: the tree is clean under these checks, so a finding is a
    # regression.
    continue-on-error: false

    env:
      # Pinned so findings do not shift with the runner image. Keep in step with
      # the clang-tidy version used locally.
      LLVM_VERSION: 23

    steps:
    - uses: actions/checkout@v7

    - name: Install LLVM ${{ env.LLVM_VERSION }}
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- ${{ env.LLVM_VERSION }}
        sudo apt install -y clang-tidy-${{ env.LLVM_VERSION }}

    - name: Install SDL, IWYU and build tools
      run: sudo apt install -y libsdl2-dev iwyu ninja-build

    - name: Configure CMake
      # Debug so DLOG/DCHECK code is compiled and analysed too.
      run: >
        cmake -B ${{ github.workspace }}/build
        -G Ninja
        -DSTRICT_CHECKS=ON
        -DCLANG_TIDY_PROGRAM=/usr/bin/clang-tidy-${{ env.LLVM_VERSION }}
        -DCMAKE_CXX_COMPILER=clang++-${{ env.LLVM_VERSION }}
        -DCMAKE_C_COMPILER=clang-${{ env.LLVM_VERSION }}
        -DCMAKE_BUILD_TYPE=Debug
        -S ${{ github.workspace }}

    - name: Build with clang-tidy and IWYU
      run: cmake --build ${{ github.workspace }}/build --parallel $(( $(getconf _NPROCESSORS_ONLN) / 2 ))
