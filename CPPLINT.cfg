# cpplint configuration (docs/CPPLINT_PLAN.md). Checked by the cpplint_test
# ctest through tools/run_cpplint.py.
set noparent
root=src
linelength=80

# Categories another tool owns or project policy overrides. Every other
# category is enforced. Filters match by prefix: a -build/include line would
# also hide build/include_order.
# whitespace/*: clang-format is the formatter of record; cpplint disagrees with
#   it (continuation lines inside namespaces, bare blocks) and otherwise flags
#   tabs and "//comment" spacing in the original EA comment blocks.
filter=-whitespace
# The project guard is CNC_RED_ALERT_<PATH>_H_; cpplint can only derive the
# path part.
filter=-build/header_guard
# CLAUDE.md: new files carry no copyright header.
filter=-legal/copyright
# NOLINT comments name clang-tidy checks, which cpplint does not know.
filter=-readability/nolint
# Google's internal list of banned headers (<filesystem>, <thread>, <chrono>).
filter=-build/c++11,-build/c++17
# DCHECK(a > b) is deliberate: the analyzer cannot see through DCHECK_GT.
filter=-readability/check
# misc-include-cleaner owns includes; cpplint's version matches bare names (a
# parameter called "string" asks for <string>).
filter=-build/include_what_you_use
# misc-explicit-constructor owns this in compiled code, and its NOLINTs mark
# the deliberate conversions, which cpplint cannot read.
filter=-runtime/explicit
# TODO(style) is Google's form; CLAUDE.md writes "// TODO: bug 12345 - ...".
filter=-readability/todo
